[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burr-model"
version = "1.0.0"
description = "Driver-based firm modeling, valuation, and structured scenario exploration"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "openpyxl>=3.1,<4"]

[project.urls]
Repository = "https://github.com/expectedparrot/burr"
Documentation = "https://github.com/expectedparrot/burr#readme"
Issues = "https://github.com/expectedparrot/burr/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
burr = "burr.cli:main"

[tool.setuptools.packages.find]
include = ["burr*"]

[tool.setuptools.package-data]
burr = ["dashboard_assets/*.html", "dashboard_assets/*.js", "agent_guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
